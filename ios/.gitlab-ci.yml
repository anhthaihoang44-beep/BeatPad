# GitLab CI/CD Pipeline for BeatPad iOS
stages:
  - lint
  - build

variables:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  SCHEME: "BeatPad"
  DESTINATION: "generic/platform=iOS"

lint:
  stage: lint
  tags:
    - macos
  script:
    - echo "Validating Swift syntax..."

build_archive:
  stage: build
  tags:
    - macos
  script:
    - xcodebuild build -project BeatPad.xcodeproj -scheme $SCHEME -destination "$DESTINATION" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
  artifacts:
    paths:
      - build/
