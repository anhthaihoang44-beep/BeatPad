name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Compile BeatPad iOS Executable with swiftc
        run: |
          mkdir -p build/BeatPad.app
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using SDK at: $SDK_PATH"
          swiftc -v -target arm64-apple-ios16.0 -sdk "$SDK_PATH" \
            -framework SwiftUI \
            -framework UIKit \
            -framework AVFoundation \
            -framework Foundation \
            -framework Combine \
            ios/BeatPad/App/BeatPadApp.swift \
            ios/BeatPad/Core/AudioEngine.swift \
            ios/BeatPad/Presentation/MainTabView.swift \
            ios/BeatPad/Presentation/LaunchpadView.swift \
            ios/BeatPad/Presentation/SequencerView.swift \
            -o build/BeatPad.app/BeatPad \
            -emit-executable
          ls -lh build/BeatPad.app/BeatPad
          file build/BeatPad.app/BeatPad

      - name: Package Real IPA
        run: |
          mkdir -p Payload/BeatPad.app
          cp build/BeatPad.app/BeatPad Payload/BeatPad.app/
          cp ios/BeatPad/Info.plist Payload/BeatPad.app/Info.plist
          echo "APPL????" > Payload/BeatPad.app/PkgInfo
          if [ -d "app/src/main/assets" ]; then
            cp -R app/src/main/assets/* Payload/BeatPad.app/
          fi
          zip -r BeatPad_iOS.ipa Payload
          ls -lh BeatPad_iOS.ipa

      - name: Upload BeatPad iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeatPad_iOS_Release
          path: BeatPad_iOS.ipa
          retention-days: 14
