name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Inspect Xcode Targets
        run: xcodebuild -list -project ios/BeatPad.xcodeproj

      - name: Build iOS Application
        run: |
          xcodebuild build \
            -project ios/BeatPad.xcodeproj \
            -target BeatPad \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products -name "BeatPad.app" | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r BeatPad_iOS.ipa Payload
          ls -lh BeatPad_iOS.ipa

      - name: Upload BeatPad iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeatPad_iOS_Release
          path: BeatPad_iOS.ipa
          retention-days: 14
