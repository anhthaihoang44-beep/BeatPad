name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Validate and Lint Project
        run: |
          plutil -lint ios/BeatPad.xcodeproj/project.pbxproj || echo "PBXPROJ LINT FAILED"

      - name: Inspect Xcode Project
        run: |
          xcodebuild -list -project ios/BeatPad.xcodeproj || true

      - name: Build with Swiftc / Clang if needed
        run: |
          mkdir -p build/BeatPad.app
          swiftc -target arm64-apple-ios16.0 -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
            ios/BeatPad/App/BeatPadApp.swift \
            ios/BeatPad/Core/AudioEngine.swift \
            ios/BeatPad/Presentation/MainTabView.swift \
            ios/BeatPad/Presentation/LaunchpadView.swift \
            ios/BeatPad/Presentation/SequencerView.swift \
            -o build/BeatPad.app/BeatPad \
            -emit-executable || echo "Direct swiftc failed, trying xcodebuild..."

      - name: Package IPA
        run: |
          mkdir -p Payload/BeatPad.app
          if [ -f "build/BeatPad.app/BeatPad" ]; then
            echo "Direct swiftc binary succeeded!"
            cp -R build/BeatPad.app/* Payload/BeatPad.app/
          else
            echo "Falling back to xcodebuild..."
            xcodebuild build -project ios/BeatPad.xcodeproj -scheme BeatPad -sdk iphoneos -configuration Release -derivedDataPath xcode_build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO || true
            APP_PATH=$(find xcode_build/Build/Products -name "BeatPad.app" | head -n 1)
            if [ -n "$APP_PATH" ]; then
              cp -R "$APP_PATH" Payload/
            fi
          fi
          cp ios/BeatPad/Info.plist Payload/BeatPad.app/Info.plist
          echo "APPL????" > Payload/BeatPad.app/PkgInfo
          zip -r BeatPad_iOS.ipa Payload
          ls -lh BeatPad_iOS.ipa

      - name: Upload BeatPad iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeatPad_iOS_Release
          path: BeatPad_iOS.ipa
          retention-days: 14
